# Expose the shared linuxbrew prefix to the systemd user session (GNOME Shell,
# portals, user services). Companion to /etc/profile.d/defenestra-brew.sh, which
# also handles MANPATH for login shells.
#
# Append, not prepend: /usr/bin/brew is our wrapper (it routes brew to the
# shared linuxbrew user via sudo), so the real brew under the prefix must not
# shadow it. Interim whole-prefix exposure; the future profile farm narrows it.
PATH=${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
