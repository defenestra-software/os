# defenestraOS Tier 1 kernel hardening.
# Memory + ASLR strengthening. Excludes sig_enforce (breaks akmods),
# lockdown=confidentiality, nosmt (cuts CPU perf), and io_uring/BPF
# restrictions (would break our shipped bpftrace/bcc + modern async I/O).

kargs = [
  "init_on_alloc=1",
  "init_on_free=1",
  "page_alloc.shuffle=1",
  "randomize_kstack_offset=on",
  "slab_nomerge",
  "vsyscall=none",
]
