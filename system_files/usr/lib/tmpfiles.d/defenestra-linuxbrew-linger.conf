# Enable systemd linger for the shared linuxbrew system user.
#
# linuxbrew is a nologin system user with no interactive session, so by default
# it has no `systemd --user` instance and no /run/user/<uid>, which is exactly
# what `brew services` needs (it drives `systemctl --user`). The presence of a
# marker file under /var/lib/systemd/linger/ tells logind to start that user's
# manager at boot and keep it running, creating /run/user/<uid>.
#
# Shipped via tmpfiles (not as a plain file under system_files/var) because /var
# is machine-local state on bootc/ostree, seeded from factory/tmpfiles at boot.
# tmpfiles runs before logind, so the marker exists when logind reads it.
d /var/lib/systemd/linger 0755 root root - -
f /var/lib/systemd/linger/linuxbrew 0644 root root - -
