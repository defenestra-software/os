# Make sure nix directories exist
d /nix 0755 root root - -
C /var/nix 0755 root root - -
d /var/nix/var/nix/daemon-socket 0755 root root - -

# Point root's profile at the system default profile so `sudo nix profile add`
# installs system-wide onto PATH set by (/etc/profile.d/defenestra-nix.sh and
# environment.d/90-defenestra-nix.conf). Without this, Nix defaults root's
# ~/.nix-profile to the per-user/root profile, which is on no one's PATH.
L+ /root/.nix-profile - - - - /nix/var/nix/profiles/default

d /run/opengl-driver 0755 root root - -
L /run/opengl-driver/lib - - - - /usr/share/defenestra/opengl-driver/lib
d /run/opengl-driver-32 0755 root root - -
L /run/opengl-driver-32/lib - - - - /usr/share/defenestra/opengl-driver/lib32
d /run/opengl-driver/share 0755 root root - -
L /run/opengl-driver/share/vulkan - - - - /usr/share/vulkan
d /run/opengl-driver-32/share 0755 root root - -
L /run/opengl-driver-32/share/vulkan - - - - /usr/share/vulkan
d /run/opengl-driver/etc 0755 root root - -
L /run/opengl-driver/etc/vulkan - - - - /etc/vulkan
d /run/opengl-driver-32/etc 0755 root root - -
L /run/opengl-driver-32/etc/vulkan - - - - /etc/vulkan
