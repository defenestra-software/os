# Defenestra ordering for numtide system-manager activation.
# system-manager builds nix expressions and writes systemd units; it MUST run
# after the nix store is mounted and nix-daemon is reachable, otherwise its
# builder cannot resolve store paths or talk to the daemon.
[Unit]
After=nix.mount nix-daemon.service
Requires=nix.mount
Wants=nix-daemon.service
