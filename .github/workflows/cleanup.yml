---
name: Prune old container images

on:
  schedule:
    - cron: '30 6 * * 0'  # Sundays at 06:30 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    name: Delete images older than 90 days
    runs-on: ubuntu-24.04
    steps:
      - name: Prune untagged + stale dated tags
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: >-
            defenestraos
            defenestraos-nvidia
            defenestraos-nvidia-open
            defenestraos-handheld
          cut-off: 90d
          image-tags: '!latest !stable !beta !canary'
          tag-selection: 'both'
