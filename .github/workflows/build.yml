# SPDX-License-Identifier: GPL-3.0-or-later
---
name: Build container images
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_DESC: "defenestraOS - Cloud-native gaming and workstation OS"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,defenestra,gaming,workstation"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # Every build lands on canary. Images reach beta and stable by being promoted
  BUILD_CHANNEL: "canary"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - defenestraos
          - defenestraos-nvidia
          - defenestraos-nvidia-open
          - defenestraos-handheld
          # defenestraos-handheld-nvidia - disabled: no NVIDIA handheld hardware exists currently
          # - defenestraos-handheld-nvidia
          # defenestraos-handheld-nvidia-open - disabled: no NVIDIA handheld hardware + Bazzite missing stable tag
          # - defenestraos-handheld-nvidia-open

    steps:
      - name: Prepare environment
        id: env
        run: |
          IMAGE_REGISTRY="${{ env.IMAGE_REGISTRY }}"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

          TARGET="${{ matrix.target }}"
          echo "IMAGE_NAME=${TARGET}" >> ${GITHUB_ENV}

          # Derive pretty name for image metadata
          case "$TARGET" in
            defenestraos)                      PRETTY="defenestraOS" ;;
            defenestraos-nvidia)               PRETTY="defenestraOS NVIDIA" ;;
            defenestraos-nvidia-open)          PRETTY="defenestraOS NVIDIA Open" ;;
            defenestraos-handheld)             PRETTY="defenestraOS Handheld" ;;
            defenestraos-handheld-nvidia)      PRETTY="defenestraOS Handheld NVIDIA" ;;
            defenestraos-handheld-nvidia-open) PRETTY="defenestraOS Handheld NVIDIA Open" ;;
          esac
          echo "VERSION_PRETTY=${PRETTY}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # On scheduled runs, skip the build if the upstream Bazzite base image
      # hasn't changed since our last published image. Manual push and PR runs
      # always build (they mean we intentionally changed something).
      - name: Check base image freshness
        id: freshness
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            defenestraos)                 BASE="ghcr.io/ublue-os/bazzite-gnome:stable" ;;
            defenestraos-nvidia)          BASE="ghcr.io/ublue-os/bazzite-gnome-nvidia:stable" ;;
            defenestraos-nvidia-open)     BASE="ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable" ;;
            defenestraos-handheld)        BASE="ghcr.io/ublue-os/bazzite-deck-gnome:stable" ;;
            defenestraos-handheld-nvidia) BASE="ghcr.io/ublue-os/bazzite-deck-nvidia-gnome:stable" ;;
            defenestraos-handheld-nvidia-open) BASE="ghcr.io/ublue-os/bazzite-deck-nvidia-open-gnome:stable" ;;
          esac

          NEW=$(skopeo inspect --format '{{.Digest}}' "docker://${BASE}")
          OLD=$(skopeo inspect "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${BUILD_CHANNEL}" 2>/dev/null \
            | jq -r '.Labels["org.defenestra.base.digest"] // empty' || true)

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${NEW}" >> "$GITHUB_OUTPUT"
          if [ -n "$OLD" ] && [ "$NEW" = "$OLD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Base image unchanged ($NEW); skipping scheduled rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Base changed (was: ${OLD:-<none>}, now: ${NEW}); building."
          fi

      - name: Stamp base digest for future freshness checks
        if: steps.freshness.outputs.skip != 'true'
        run: |
          # Push/PR/manual runs skip the freshness step, so re-read here to
          # ensure every published image gets the label.
          case "${{ matrix.target }}" in
            defenestraos)                 BASE="ghcr.io/ublue-os/bazzite-gnome:stable" ;;
            defenestraos-nvidia)          BASE="ghcr.io/ublue-os/bazzite-gnome-nvidia:stable" ;;
            defenestraos-nvidia-open)     BASE="ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable" ;;
            defenestraos-handheld)        BASE="ghcr.io/ublue-os/bazzite-deck-gnome:stable" ;;
            defenestraos-handheld-nvidia) BASE="ghcr.io/ublue-os/bazzite-deck-nvidia-gnome:stable" ;;
            defenestraos-handheld-nvidia-open) BASE="ghcr.io/ublue-os/bazzite-deck-nvidia-open-gnome:stable" ;;
          esac
          echo "BASE_DIGEST=$(skopeo inspect --format '{{.Digest}}' docker://${BASE})" >> "$GITHUB_ENV"

      - name: Get current date
        if: steps.freshness.outputs.skip != 'true'
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          # Identifies the build, not the channel.
          echo "build_id=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.BUILD_CHANNEL }}
            type=raw,value=${{ env.BUILD_CHANNEL }}.{{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.date.outputs.build_id }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=GPL-3.0-or-later
            io.artifacthub.package.prerelease=false
            containers.bootc=1
            org.defenestra.base.digest=${{ env.BASE_DIGEST }}
          sep-tags: " "
          sep-annotations: " "

      # Login before build so buildah can pull base images from GHCR
      - name: Login to GitHub Container Registry
        if: steps.freshness.outputs.skip != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        if: steps.freshness.outputs.skip != 'true'
        id: build_image
        run: |
          sudo buildah build \
            --target ${{ matrix.target }} \
            --build-arg VERSION_TAG="${{ steps.date.outputs.build_id }}" \
            --build-arg VERSION_PRETTY="${{ env.VERSION_PRETTY }}" \
            --tag ${{ env.IMAGE_NAME }}:${{ env.BUILD_CHANNEL }} \
            --layers \
            --format docker \
            .

          # Tag all metadata tags
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo buildah tag ${{ env.IMAGE_NAME }}:${{ env.BUILD_CHANNEL }} ${{ env.IMAGE_NAME }}:${tag}
          done

      - name: Push To GHCR
        if: steps.freshness.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo podman push ${{ env.IMAGE_NAME }}:${tag} ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.freshness.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v2.6.1'

      - name: Sign container image
        if: steps.freshness.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
